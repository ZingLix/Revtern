# Before applying this manifest:
#   1. Replace both REPLACE_ME values in the Secret.
#   2. Replace revtern.example.com in the ConfigMap and Ingress.
#   3. Pin the image to a release tag or digest for production.
#   4. Make sure an Ingress controller and the revtern-tls Secret exist.
# If the GHCR package is private, create an imagePullSecret and reference it
# under Deployment.spec.template.spec.imagePullSecrets.
---
apiVersion: v1
kind: Namespace
metadata:
  name: revtern
---
apiVersion: v1
kind: Secret
metadata:
  name: revtern
  namespace: revtern
type: Opaque
stringData:
  # Example: postgres://revtern:password@postgres.example.com:5432/revtern?sslmode=require
  DATABASE_URL: REPLACE_ME
  # Generate with: openssl rand -hex 32
  REVTERN_SECRET_KEY: REPLACE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: revtern
  namespace: revtern
data:
  REVTERN_AUTH_MODE: single_user
  REVTERN_BASE_URL: https://revtern.example.com
  REVTERN_BIND: 0.0.0.0:3000
  REVTERN_ENV: production
  REVTERN_WEB_DIST: /app/web
  RUST_LOG: revtern_api=info,tower_http=info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revtern
  namespace: revtern
  labels:
    app.kubernetes.io/name: revtern
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: revtern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revtern
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: revtern
          # Prefer a release tag such as v0.1.0 or an immutable sha-* tag.
          image: ghcr.io/zinglix/revtern:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: revtern
            - secretRef:
                name: revtern
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: revtern
  namespace: revtern
  labels:
    app.kubernetes.io/name: revtern
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: revtern
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: revtern
  namespace: revtern
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - revtern.example.com
      secretName: revtern-tls
  rules:
    - host: revtern.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: revtern
                port:
                  name: http
